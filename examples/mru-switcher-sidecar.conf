# MRU Switcher — sidecar config (Lua/Omarchy hosts)
# =====================================================================
# On Lua-config Hyprland builds (e.g. 0.56.2) the `plugin:mru-switcher:*`
# keys are UNSETTABLE: the Lua validator rejects plugin special-category
# keys, so `hl.config({ plugin = ... })` and the config file both fail with
# `unknown config key 'plugin.mru-switcher.*'` (see ADR-024 and
# docs/agent-state/reports/2026-09-22-lua-host-plugin-config-dead-end.md).
#
# This file is the workaround: the plugin reads it directly at load and on
# every `hyprctl reload`, bypassing the host validator. Copy to:
#
#   ~/.config/mru-switcher/config
#
# (or `$XDG_CONFIG_HOME/mru-switcher/config`). Missing file = compiled
# defaults (hyprlang hosts: just use `examples/mru-switcher.conf` instead).
#
# Format: one `key = value` per line. `#` / `;` start a comment (full-line or
# trailing after a blank). Unknown keys are ignored with a warning; invalid
# values keep the built-in default with a warning. Same 12 keys as SPEC §4 —
# no new keys, no renames. `lock_history_on_session` is reserved and ignored
# (ADR-021); do not set it.

# Visual feedback while a session is active: null | border | external.
# BUILT-IN DEFAULT (ADR-025): border. Set null to disable visual feedback.
ui                      = border

# AF_UNIX socket path, used only when ui = external. Leave empty otherwise;
# an empty path makes ui = external behave like null.
external_socket         =

# Border highlight style (ui = border): solid is the only effective style;
# other names behave as solid with a warning (REQ-UI-007).
border_style            = solid

# Border highlight colour (ui = border): hex 0xAARRGGBB or rgb()/rgba().
border_color            = 0xffffd9a0

# Border size override (ui = border): -1 keeps the window's own border size.
border_size             = -1

# Keep the selected window visible while ui = border (ADR-026): activate its
# workspace for the session (no window/keyboard focus), restore on cancel.
# false = pre-ADR-026 off-screen highlight. BUILT-IN DEFAULT: true.
selection_follow_workspace = true

# Debounce before MRU commits a focus change (ms); 0 = immediate; [0, 5000].
debounce_ms             = 400

# Default scope for mru:cycle without explicit scope:
# global | monitor | workspace | visible | app
default_scope           = global

# Selection start offset: first | second (classic Alt+Tab = second).
start_offset            = second

# Wrap the selection at the list ends.
wrap                    = true

# On cancel, refocus the window focused at session start.
restore_focus_on_cancel = false
