# MRU Switcher — example configuration
# =====================================================================
#
# Copy this file to ~/.config/hypr/conf.d/mru-switcher.conf and add to
# your hyprland.conf (or whichever file you already source):
#
#   source = ~/.config/hypr/conf.d/mru-switcher.conf
#
# This file is complete and loadable as-is: every key below is registered
# by the plugin, and the values match the plugin's built-in defaults
# unless a difference is marked inline.

plugin {
    mru-switcher {
        # How long to wait after a focus change before committing it to
        # the most-recently-used history (milliseconds). Short-lived focus
        # moves (mouse sweeps, transient focus) are filtered out. 0 commits
        # immediately.
        # Default: 400   Allowed: 0 - 5000
        debounce_ms             = 400

        # Scope used when mru:cycle is called without an explicit scope.
        #   global    - every mapped window
        #   monitor   - windows on the current monitor
        #   workspace - windows on the current workspace
        #   visible   - windows on currently visible workspaces
        #   app       - windows of the currently focused app
        # Default: global
        default_scope           = global

        # Which list position is selected when a session starts.
        #   first  - the single most recent window
        #   second - the previous window (classic Alt+Tab behaviour)
        # Default: second
        start_offset            = second

        # Whether cycling past the end of the list wraps back to the start.
        # Set false to stop at the ends instead.
        # Default: true
        wrap                    = true

        # Visual feedback while a session is active.
        #   null     - no visual feedback (logic only)
        #   border   - highlight the selected window's border while holding Alt
        #   external - drive an external overlay through a socket (advanced)
        # DEMO OVERRIDE → DEFAULT (ADR-025): the plugin's built-in default is now
        # border itself; this line keeps it explicit so you can find and flip it.
        # Set null to disable visual feedback.
        ui                      = border

        # AF_UNIX socket path used only when ui = external. Leave empty
        # otherwise; an empty path makes ui = external behave like null.
        # Default: (empty)
        external_socket         =

        # Border highlight style (used when ui = border).
        #   solid - constant highlight colour
        #   pulse - the colour throbs between border_color and a darker
        #           variant of it every half of pulse_period_ms (REQ-UI-013)
        #   dim   - the selected window keeps the highlight colour and every
        #           other valid ring window is dimmed to dim_alpha (REQ-UI-014)
        # Unknown tokens fall back to solid with a one-time warning.
        # Default: solid
        border_style            = solid

        # Border highlight colour (used when ui = border). Formats accepted
        # by Hyprland: hex 0xAARRGGBB, rgb(...), rgba(...).
        # Default: 0xffffd9a0
        border_color            = 0xffffd9a0

        # Border size applied to the highlighted window. -1 keeps the
        # window's own border size (colour-only highlight).
        # Default: -1
        border_size             = -1

        # One full pulse throb cycle in milliseconds (border_style = pulse
        # only). The highlight alternates colour every half cycle.
        # Default: 1000   Allowed: 200 - 10000 (clamped)
        pulse_period_ms         = 1000

        # Alpha applied to the non-selected ring windows (border_style = dim
        # only): 0.7 dims them to 70% opacity so the target stands out.
        # 1.0 (or higher) disables dimming.
        # Default: 0.7   Allowed: 0.0 - 1.0 (clamped)
        dim_alpha               = 0.7

        # While ui = border, keep the selected window visible: if its
        # workspace is not active on its monitor, that workspace is activated
        # for the duration of the session (NO window/keyboard focus moves;
        # restored on cancel — ADR-026 / REQ-UI-012). Set false for the
        # pre-ADR-026 behaviour (highlight may be off-screen).
        # Default: true
        selection_follow_workspace = true

        # On cancel (Escape / mru:cancel), switch focus back to the window
        # that was focused when the session started.
        # Default: false
        restore_focus_on_cancel = false
    }
}