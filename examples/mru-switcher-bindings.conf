# MRU Switcher — recommended keybindings
# =====================================================================
#
# Copy this file to ~/.config/hypr/conf.d/mru-switcher-bindings.conf and
# add to your hyprland.conf (or whichever file you already source):
#
#   source = ~/.config/hypr/conf.d/mru-switcher-bindings.conf
#
# The plugin does not capture the keyboard itself, so the modifier-release
# bind (bindrt) below is what commits your selection. These four binds are
# all you need for the classic Niri-style Alt+Tab workflow.
#
# Lua / Omarchy? This hyprlang fragment is not a working recipe there — use
# examples/mru-switcher-bindings.lua (hl.plugin.mru.* + apply-on-Tab-release)
# instead. See ADR-022 for the host modifier-release caveat.

# Cycle forward through the most-recently-used list.
bind = ALT, TAB, mru:cycle, next

# Cycle backward.
bind = ALT SHIFT, TAB, mru:cycle, prev

# Apply the selection when Alt is released.
bindrt = ALT, ALT_L, mru:apply
# If you use the right Alt key instead: bindrt = ALT, ALT_R, mru:apply
#
# Caveat (ADR-022, Hyprland v0.56.2 / efb5099): on the Lua keybind path,
# release binds on a MODIFIER key never fire. If you are on Lua/Omarchy,
# load examples/mru-switcher-bindings.lua instead — it applies on Tab
# release (an ordinary key, which fires reliably), same Niri-style result.

# Cancel the session (no focus change).
bind = ALT, Escape, mru:cancel