name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (clang 22 from apt.llvm.org)
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | \
            sudo tee /etc/apt/sources.list.d/llvm-22.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-22 clang-format-22 cmake ninja-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DMRU_BUILD_TESTS=ON \
            -DMRU_BUILD_PLUGIN=OFF \
            -DMRU_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: clang-format (dry-run)
        run: |
          mapfile -t files < <(find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then echo "No sources"; exit 0; fi
          clang-format-22 --dry-run -Werror "${files[@]}"

  domain-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Forbid hyprland includes in domain
        run: |
          if grep -RIn '#include <hyprland' include/mru/domain src/domain 2>/dev/null; then
            echo "domain must not include hyprland headers"; exit 1
          fi
          echo OK

  plugin-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - name: MRU_BUILD_PLUGIN=ON declares the mru-switcher target
        run: |
          cmake -S . -B build-plugin -DMRU_BUILD_PLUGIN=ON
          cmake --build build-plugin --target help | grep -q 'mru-switcher' || { echo "target mru-switcher missing"; exit 1; }
          echo "target present"
      - name: Config keys are namespaced and registered in one place (ADR-008)
        run: |
          if grep -Rn "addConfigValue" src include | grep -v "^src/plugin/mru_plugin.cpp:"; then
            echo "addConfigValue must only appear in src/plugin/mru_plugin.cpp"; exit 1
          fi
          bad=$(grep -o 'addConfigValue(PHANDLE, "[^"]*"' src/plugin/mru_plugin.cpp | grep -v 'plugin:mru-switcher:' || true)
          if [ -n "$bad" ]; then echo "keys outside plugin:mru-switcher: -> $bad"; exit 1; fi
          echo OK
      - name: Plugin core stays Hyprland-free (ADR-007)
        run: |
          if grep -n "#include <hyprland" src/plugin/*.cpp src/plugin/*.hpp | grep -v "^src/plugin/mru_plugin.cpp:"; then
            echo "plugin core must stay Hyprland-free (only the facade src/plugin/mru_plugin.cpp may include hyprland headers)"; exit 1
          fi
          echo OK
