name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (clang 22 from apt.llvm.org)
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | \
            sudo tee /etc/apt/sources.list.d/llvm-22.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-22 clang-format-22 cmake ninja-build
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DMRU_BUILD_TESTS=ON \
            -DMRU_BUILD_PLUGIN=OFF \
            -DMRU_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: clang-format (dry-run)
        run: |
          mapfile -t files < <(find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' \) 2>/dev/null || true)
          if [ ${#files[@]} -eq 0 ]; then echo "No sources"; exit 0; fi
          clang-format-22 --dry-run -Werror "${files[@]}"

  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (clang 22 from apt.llvm.org)
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | \
            sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | \
            sudo tee /etc/apt/sources.list.d/llvm-22.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-22 cmake ninja-build
      - name: Install sanitizer runtimes (ASan/UBSan)
        run: sudo apt-get install -y --no-install-recommends libclang-rt-22-dev
      - name: Configure (ASan + UBSan)
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++-22 \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DMRU_BUILD_TESTS=ON \
            -DMRU_BUILD_PLUGIN=OFF \
            -DMRU_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-san -j
      - name: Test
        run: ctest --test-dir build-san --output-on-failure

  gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (system gcc)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends g++ cmake ninja-build
      - name: Configure
        run: |
          cmake -S . -B build-gcc -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DMRU_BUILD_TESTS=ON \
            -DMRU_BUILD_PLUGIN=OFF \
            -DMRU_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-gcc -j
      - name: Test
        run: ctest --test-dir build-gcc --output-on-failure

  plugin-build:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Init pacman + install Hyprland headers (pinned release)
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel git cmake ninja pkgconf \
            hyprland hyprutils \
            pango cairo libdrm libinput libxkbcommon \
            wayland wayland-protocols pixman \
            aquamarine hyprcursor hyprgraphics hyprlang
      - name: Assert pinned Hyprland headers (ADR-010/Q2)
        run: |
          have="$(pkg-config --modversion hyprland)"
          want="0.56.2"
          echo "pkg-config hyprland: ${have}"
          if [ "$have" != "$want" ]; then
            echo "::error::CI Hyprland headers ${have} != pinned ${want}; update pin + VERSION-MAP + docs/HYPRLAND-PLUGIN-SYSTEM.md"
            exit 1
          fi
      - name: Configure (real .so build)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DMRU_BUILD_TESTS=ON \
            -DMRU_BUILD_PLUGIN=ON \
            -DMRU_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j
      - name: Verify .so artifact
        run: |
          test -f build/mru-switcher.so || { echo "mru-switcher.so missing"; exit 1; }
          file build/mru-switcher.so | grep -q 'ELF.*shared object' || { echo "not a shared object"; file build/mru-switcher.so; exit 1; }
          echo "artifact OK:"
          file build/mru-switcher.so
      - name: Test (domain + plugin core against real headers)
        run: ctest --test-dir build --output-on-failure

  domain-deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Forbid hyprland/hyprutils includes in domain
        run: |
          if grep -RInE '#include[ <"](hyprland|hyprutils)' include/mru/domain src/domain 2>/dev/null; then
            echo "domain must not include hyprland/hyprutils headers"; exit 1
          fi
          echo OK

  plugin-guards:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake
      - name: MRU_BUILD_PLUGIN=ON declares the mru-switcher target
        run: |
          cmake -S . -B build-plugin -DMRU_BUILD_PLUGIN=ON
          cmake --build build-plugin --target help | grep -q 'mru-switcher' || { echo "target mru-switcher missing"; exit 1; }
          echo "target present"
      - name: Config keys are namespaced and registered in one place (ADR-008)
        run: |
          # V2 registration lives only in the config layer and the facade.
          if grep -Rn "addConfigValueV2" src include \
              | grep -vE '^src/plugin/(config_v2\.cpp|config_v2\.hpp|mru_plugin\.cpp):'; then
            echo "addConfigValueV2 must only appear in src/plugin/config_v2.{cpp,hpp} or src/plugin/mru_plugin.cpp"; exit 1
          fi
          bad=$(grep -ohE 'plugin:[^" ]*"' src/plugin/config_v2.cpp src/plugin/config_v2.hpp src/plugin/mru_plugin.cpp \
              | grep -v '^plugin:mru-switcher:' || true)
          if [ -n "$bad" ]; then echo "keys outside plugin:mru-switcher: -> $bad"; exit 1; fi
          echo OK
      - name: Plugin core stays Hyprland-free (ADR-007)
        run: |
          # The plugin core library (config_value, dispatch_args, status_format,
          # mru_merge, sidecar_config, session_ui, overlay protocol/socket) must
          # stay Hyprland-free; only the .so facade TUs (mru_plugin.cpp/hpp,
          # plugin_dispatch/lua_bridge/events/overlay_wiring/lifecycle +
          # plugin_internal.hpp) and the V2 config layer (config_v2.cpp/hpp,
          # which reads Hyprland config values) may pull hyprland/hyprutils types.
          if grep -nE '#include[ <"]*hypr(land|utils)' src/plugin/*.cpp src/plugin/*.hpp \
              | grep -vE '^src/plugin/(mru_plugin\.cpp|mru_plugin\.hpp|config_v2\.cpp|config_v2\.hpp|plugin_dispatch\.cpp|plugin_dispatch\.hpp|plugin_lua_bridge\.cpp|plugin_lua_bridge\.hpp|plugin_events\.cpp|plugin_events\.hpp|plugin_overlay_wiring\.cpp|plugin_overlay_wiring\.hpp|plugin_lifecycle\.cpp|plugin_lifecycle\.hpp|plugin_internal\.hpp):' ; then
            echo "plugin core must stay Hyprland-free (only the facade TUs mru_plugin/plugin_dispatch/plugin_lua_bridge/plugin_events/plugin_overlay_wiring/plugin_lifecycle/plugin_internal and the config layer config_v2.{cpp,hpp} may include hyprland/hyprutils)"; exit 1
          fi
          echo OK
      - name: Forbid V1 config reads and raw ptr() casts (RP-1, RP-3)
        run: |
          # V2 is the only config backend: the V1 API (getConfigValue / addConfigValue /
          # dataPtr) and CConfigValue::ptr() (a hard RASSERT on std::string) must not
          # reappear under src/.
          if grep -RnE 'getConfigValue|addConfigValue\(|\.dataPtr\(|->[[:space:]]*ptr\(' src; then
            echo "V1 config API (getConfigValue/addConfigValue/dataPtr) and ->ptr() config access are forbidden"; exit 1
          fi
          echo OK

  release-guard:
    # M6-T3 (issue #49): cheap release-readiness invariants — grep + python3
    # stdlib only, no toolchain install, ~30s on stock ubuntu-24.04.
    # Nested Hyprland smoke stays a MANUAL pre-tag gate on purpose: a CI
    # runner cannot stage an honest nested Wayland/compositor deterministically
    # (see docs/agent-state/reports/2026-09-19-m6-manual-nest-gate.md).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: ctest matrix holds the M6 stress binaries (T-H-06/07/08)
        run: |
          # Floor 17 = 8 domain (6 base + 2 M6 stress binaries:
          # domain_stress_window_close = T-H-06, domain_stress_focus_invalidation
          # = T-H-07; T-H-08 rides inside domain_session_controller) + 9
          # plugin-core binaries. Counted from add_test() declarations, so no
          # Hyprland headers or configure step are required.
          n=$(grep -c '^[[:space:]]*add_test(' CMakeLists.txt || true)
          echo "add_test count: ${n} (floor 17)"
          [ "${n}" -ge 17 ] || { echo "::error::ctest matrix shrank to ${n} < 17 — a test binary was dropped"; exit 1; }
          echo OK
      - name: REQ-TRACE covers the M6 stress tests
        run: |
          for id in T-H-06 T-H-07 T-H-08; do
            grep -q "$id" docs/REQ-TRACE.md || { echo "::error::docs/REQ-TRACE.md lacks $id"; exit 1; }
          done
          echo "OK: T-H-06/07/08 present in REQ-TRACE"
      - name: CHANGELOG [Unreleased] is non-empty
        run: |
          awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md \
            | grep -qE '^[[:space:]]*[-*] ' \
            || { echo "::error::CHANGELOG [Unreleased] has no bullets under Added/Changed/Fixed/Tests"; exit 1; }
          echo OK
      - name: hyprpm.toml parses and commit_pins is populated (REQ-H-004)
        run: |
          python3 -c "import tomllib; d=tomllib.load(open('hyprpm.toml','rb')); pins=d.get('repository',{}).get('commit_pins',[]); assert pins, 'commit_pins empty'; print('commit_pins:', pins)"

  installer:
    # M6 packaging (ADR-020 §4; SPEC REQ-DIST-027 / T-DIST-05): static + dry-run
    # guard for the optional source helper. A stock runner has no Hyprland
    # headers, so this job deliberately never performs a real build - `bash -n`,
    # shellcheck and `--dry-run` (which needs no headers) only. Cheap and fast.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: bash -n (syntax)
        run: |
          bash -n scripts/install.sh
          bash -n scripts/setup-bindings.sh
      - name: shellcheck (fallback to bash -n with a clear message)
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y --no-install-recommends shellcheck || true
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            shellcheck scripts/install.sh
            echo "OK: shellcheck clean"
          else
            echo "::warning::shellcheck is unavailable on this runner - falling back to bash -n only (T-DIST-05 partial)"
            bash -n scripts/install.sh
          fi
      - name: --help and --version exit 0
        run: |
          ./scripts/install.sh --help > /dev/null
          ./scripts/install.sh --version
          ./scripts/setup-bindings.sh --help > /dev/null
          ./scripts/setup-bindings.sh --version
      - name: --dry-run in a clean temp checkout exits 0 and writes nothing (no opt-in needed)
        run: |
          tmp="$(mktemp -d)"
          cp -a examples scripts CMakeLists.txt hyprpm.toml "$tmp/"
          before="$(cd "$tmp" && find . -type f -printf '%P %s\n' | sort | md5sum)"
          (cd "$tmp" && ./scripts/install.sh --dry-run) | tee /tmp/dry.log
          after="$(cd "$tmp" && find . -type f -printf '%P %s\n' | sort | md5sum)"
          [ "$before" = "$after" ] || { echo "::error::--dry-run modified the tree"; exit 1; }
          [ ! -e "$tmp/build" ] || { echo "::error::--dry-run created build/"; exit 1; }
          grep -q "source root" /tmp/dry.log || { echo "::error::plan does not report the source root"; exit 1; }
          # REQ-DIST-026(a): a non-canonical checkout is supported and reported, not refused.
          grep -q "custom checkout" /tmp/dry.log || { echo "::error::plan does not report the custom checkout layout"; exit 1; }
          # Deprecated opt-in flag stays accepted (backward compatibility).
          ./scripts/install.sh --dry-run --allow-non-canonical > /dev/null
          echo "OK: dry-run wrote nothing, custom checkout accepted, deprecated flag accepted"
      - name: negative cases exit non-zero (unknown option, stray arg, non-checkout target)
        run: |
          check() { # expected_code, description, args...
            local want="$1" desc="$2"
            shift 2
            set +e
            ./scripts/install.sh "$@" > /tmp/out.log 2>&1
            local code=$?
            set -e
            echo "${desc}: exit ${code}"
            [ "${code}" -eq "${want}" ] || { echo "::error::${desc}: expected exit ${want}, got ${code}"; cat /tmp/out.log; exit 1; }
            grep -q -e '--help' /tmp/out.log || { echo "::error::${desc}: message lacks a --help hint"; exit 1; }
          }
          check 2 "unknown option" --definitely-not-an-option
          check 2 "stray argument" some-stray-argument
          check 2 "invalid --jobs" --jobs 0
          not_a_checkout="$(mktemp -d)"
          check 3 "target is not a mru-switcher checkout" --dir "$not_a_checkout"
          echo "OK: negative cases behaved as documented"
      - name: setup-bindings sandbox (backend detect, dry-run no-write, force+backup, negative)
        run: |
          sb="$(mktemp -d)"
          SB_PATH="$(pwd)/scripts/setup-bindings.sh"
          mkdir -p "$sb/examples"
          cp examples/mru-switcher-bindings.lua examples/mru-switcher-bindings.conf "$sb/examples/"
          export XDG_CONFIG_HOME="$sb/hypr-config"
          mkdir -p "$XDG_CONFIG_HOME/hypr"
          # auto -> lua when hyprland.lua exists; dry-run writes nothing
          touch "$XDG_CONFIG_HOME/hypr/hyprland.lua"
          before="$(find "$XDG_CONFIG_HOME" -type f | sort)"
          (cd "$sb" && bash "$SB_PATH" --from "$sb/examples" --dry-run) > /tmp/sb.out 2>&1
          grep -q 'config backend: lua' /tmp/sb.out || { echo "::error::backend detection failed"; cat /tmp/sb.out; exit 1; }
          after="$(find "$XDG_CONFIG_HOME" -type f | sort)"
          [ "$before" = "$after" ] || { echo "::error::--dry-run wrote a file"; exit 1; }
          # real run writes the lua fragment
          (cd "$sb" && bash "$SB_PATH" --from "$sb/examples" --quiet) > /tmp/sb.out 2>&1
          [ -f "$XDG_CONFIG_HOME/hypr/mru-switcher-bindings.lua" ] || { echo "::error::lua fragment not written"; exit 1; }
          # existing file refuses without --force; --force backs up
          if (cd "$sb" && bash "$SB_PATH" --from "$sb/examples" --quiet); then
            echo "::error::second write should refuse without --force"; exit 1
          fi
          (cd "$sb" && bash "$SB_PATH" --from "$sb/examples" --quiet --force) > /dev/null 2>&1
          ls "$XDG_CONFIG_HOME/hypr/"*.bak.* > /dev/null 2>&1 || { echo "::error::--force did not create a backup"; exit 1; }
          # hyprlang backend -> conf.d target
          rm -f "$XDG_CONFIG_HOME/hypr/hyprland.lua"
          (cd "$sb" && bash "$SB_PATH" --from "$sb/examples" --backend hyprlang --quiet) > /dev/null 2>&1
          [ -f "$XDG_CONFIG_HOME/hypr/conf.d/mru-switcher-bindings.conf" ] || { echo "::error::hyprlang fragment not written"; exit 1; }
          # unknown flag is a usage error (exit 2)
          if bash "$SB_PATH" --definitely-not-an-option; then
            echo "::error::unknown option should fail"; exit 1
          fi
          echo "OK: setup-bindings sandbox passed"

