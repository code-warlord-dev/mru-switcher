# Distribution manifest for hyprpm (M6-T5, issue #47).
#
# Hyprland pins: each entry is "<hyprland_sha> = <plugin_sha>".
# Single tested pin for v1.0.0 (Variant A): v0.56.2 (efb50993780079460b0cbed1363e2166a2de1d9f) —
# the only revision covered by nest smokes per docs/COMPAT.md.
# Older multi-pin entries (v0.56.1 / v0.56.0 / v0.55.0 / v0.54.0) were declared
# but UNTESTED — removed for the 1.0 release; re-add only with nest evidence.
# Pinning is a **release contract** (COMPAT "Risk note").
#
# The plugin-side hash below is the release-prep squash-merge commit eda3bd9
# on main (PR #117, nest-gated 2026-09-24); the v1.0.0 tag sits on the pin-fix
# commit carrying this exact pin (Variant A — see docs/VERSION-MAP.md 1.0.0 row).
[repository]
name = "mru-switcher"
# Attribution for hyprpm metadata (VERSION-MAP 1.0.0 / M6-T9 prep): name + handle,
# no email anywhere in the repository - contact is the GitHub repo/profile.
authors = ["Yuriy Tretyakov (code-warlord-dev)"]
# commit_pins: "<hyprland_sha> = <plugin_sha>" (hyprpm reads this array).
# v1.0.0 (Variant A single-pin): plugin-side = the release-prep squash-merge
# commit eda3bd9 on main (PR #117). The v1.0.0 tag is placed on the pin-fix
# commit that contains this exact line — same tree content as eda3bd9 plus
# this pin, nest-gated 2026-09-24 (docs/agent-state/reports/2026-09-24-m6-pre-tag-smoke.md).
commit_pins = ["efb50993780079460b0cbed1363e2166a2de1d9f = eda3bd9d5c31441c003267ea646446a548fbf02e"]

[mru-switcher]
description = "Niri-style MRU Alt+Tab for Hyprland (snapshot, apply-on-release, lock-in)"
# Authors filled for v0.3.0 (audit L-14 hyprpm publish blocker); commit_pins
# single tested pin for v1.0.0 (Variant A, M6-T9) — see the header note.
# Attribution matches PLUGIN_INIT / LICENSE / README (name + handle, no email).
authors = ["Yuriy Tretyakov (code-warlord-dev)"]
output = "build/mru-switcher.so"
build = [
  "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMRU_BUILD_PLUGIN=ON",
  "cmake --build build -j"
]
