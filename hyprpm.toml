# Distribution manifest for hyprpm (M6-T5, issue #47).
#
# Hyprland pins: each entry is "<hyprland_sha> = <plugin_sha>".
# Primary tested pin: v0.56.2 (efb50993780079460b0cbed1363e2166a2de1d9f) —
# the only revision covered by nest smokes per docs/COMPAT.md.
# Entries for v0.56.1 / v0.56.0 / v0.55.0 / v0.54.0 are declared but
# UNTESTED (no nest on those revisions; see COMPAT matrix) — honest
# multi-pin for hyprpm users on slightly older compositors.
# Pinning is a **release contract** (COMPAT "Risk note").
#
# The plugin-side hash is finalized to the multi-pin main revision
# PLACEHOLDER_MULTI_PIN_PLUGIN_SHA (2026-09-20, docs/metadata-only
# multi-pin pass; M6-T9 prep follow-up).
# The v1.0.0 tag itself remains an explicit human gate; the pins MUST be
# re-verified against the tagged commit before the release is published.
[repository]
name = "mru-switcher"
authors = ["code-warlord-dev"]
# commit_pins: "<hyprland_sha> = <plugin_sha>" (hyprpm reads this array).
# Plugin-side hash finalized at multi-pin commit (M6-T9 prep follow-up);
# re-verify against the tagged commit at v1.0.0.
commit_pins = ["efb50993780079460b0cbed1363e2166a2de1d9f = PLACEHOLDER_MULTI_PIN_PLUGIN_SHA", "5c9377c15f85c50648f35ca5a213754f95b93ca0 = PLACEHOLDER_MULTI_PIN_PLUGIN_SHA", "36b2e0cfe0c6094dbc47bd42a437431315bb3087 = PLACEHOLDER_MULTI_PIN_PLUGIN_SHA", "af923e30d1d24f1f4a4f5cb8308065173c1d9539 = PLACEHOLDER_MULTI_PIN_PLUGIN_SHA", "0002f148c9a4fe421a9d33c0faa5528cdc411e62 = PLACEHOLDER_MULTI_PIN_PLUGIN_SHA"]

[mru-switcher]
description = "Niri-style MRU Alt+Tab for Hyprland (snapshot, apply-on-release, lock-in)"
# Authors filled for v0.3.0 (audit L-14 hyprpm publish blocker); commit_pins
# populated for M6-T5; plugin-side hash finalized in the M6-T9 prep pass —
# see the header note (the tag itself remains an explicit human gate).
authors = ["code-warlord-dev"]
output = "build/mru-switcher.so"
build = [
  "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMRU_BUILD_PLUGIN=ON",
  "cmake --build build -j"
]
